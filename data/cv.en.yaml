# CV data source — ENGLISH (public layer).
# Single source of truth for the site (/). See data/cv.es.yaml for the
# Spanish source (/es): same shape, same meta.sectionOrder, sentence-for-
# sentence equivalent content — not a literal translation.
#
# Voice:
# - Personal and professional content speaks in the first person.
# - Projects may describe the system in the third person.
#
# Goal:
# Introduce the person first, then demonstrate technical capability
# through projects and real production experience.
#
# CONTRACT with the code (src/lib/content.js, splitParagraphs): any folded
# block (`>-`) that holds more than one paragraph (person.intro, project
# descriptions, experience summaries) splits on the blank line between
# paragraphs. If changed to a literal block (`|`), every wrapped line would
# render as its own paragraph instead of one.
#
# Employers: each experience entry carries employer.name and
# employer.sector, both public. The only contact detail kept separate, in
# a private layer consumed only by PDF generation, is the phone number
# (data/private/, gitignored — see data/schemas/cv.private.schema.json).

meta:
  language: en
  lastUpdated: "2026-09-21"

  sectionOrder:
    - intro
    - skills
    - projects
    - experience
    - education
    - contact

