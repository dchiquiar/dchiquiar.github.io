    highlights:
      - "Designed and built from scratch a WPF desktop application (.NET Core, MVVM) that works as an operations console and hosts Quartz.NET jobs for automatic bank reconciliation: it consumes the smart-safe web services, processes deposits, and generates the reconciliation files sent to the banks. Over 1 year in production, ~1,500 reconciliations per day with no manual intervention, integrating 6 banks."
      - "Redesigned the job-scheduling engine: replaced fixed-schedule jobs with a database-configurable architecture built on Quartz.NET. Uses a mutex to enforce a single running instance and a local SQLite database to persist the day's job state, so a restart doesn't lose what already ran. Lets client schedules change without new deployments."
      - "Rebuilt, end to end, in .NET for Android, a geolocated valuables-tracking app that was originally built in Xamarin.Forms. Published on Google Play Console, with ~20 operational users."
      - "Built a remittance-tracking system for clients with online status and location lookups, reducing manual inquiries to the customer service team."
      - "Maintained an internal WinForms ERP used by the HR, Sales, Billing and Treasury departments, distributed via installer."
      - "Built internal REST APIs and their interfaces following SOLID principles, and trained end users."
