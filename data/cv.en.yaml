experience:
  - id: job-1

    role: "Software Developer"

    employer:
      name: "Tecnisegur"
      sector: "Cash-in-transit and security services"

    location: "Montevideo, Uruguay"

    startDate: "2024-04"
    endDate: "2026-09"
    current: false

    summary: >-
      I designed and built .NET applications to automate banking,
      operational, and commercial processes, including integrations with
      six banks and systems that process around 1,500 operations a day
      in production.

    projects:
      - name: "TAAS — Tecnisegur Automatic Accreditation System"

        description: >-
          I built a system that automates the bank settlements generated
          by deposits made into smart safes.

          It integrates with six banks through different mechanisms, from
          file exchange to web services, and processes around 1,500
          operations a day with no manual intervention.

          It also includes monitoring and reprocessing tools so operators
          can resolve exceptions without disrupting the system's normal
          flow.

        technologies:
          - "C#"
          - ".NET"
          - "ASP.NET Core"
          - "WPF"
          - "MVVM"
          - "Quartz.NET"
          - "SQL Server"
          - "SQLite"
          - "Azure"


      - name: "Valuables Tracking App"

        description: >-
          I built an Android app for the operational tracking of
          shipments through seal scanning, geolocation, and status
          changes.

          It was designed to work offline: it stores operations locally
          during periods without coverage and syncs them once
          connectivity is restored.

          The app was published and distributed through Google Play.

        technologies:
          - ".NET for Android"
          - "Xamarin.Forms"
          - "SQLite"
          - "Google ML Kit"
          - "Geolocation"
          - "Google Play Console"


      - name: "Subscriptions and Payments System"

        description: >-
          I built an internal API that integrates the commercial platform
          with Mercado Pago to manage payments and subscriptions.

          The system handles the full lifecycle of each transaction,
          including approvals, rejections, expirations, reversals,
          renewals, and cancellations, and integrates Twilio to send the
          associated notifications.

        technologies:
          - "C#"
          - ".NET"
          - "ASP.NET Core"
          - "REST API"
          - "Mercado Pago API"
          - "SQL Server"
          - "Twilio"

    highlights:
      - >-
        I maintained and built modules for HR, Sales, Billing, and
        Treasury on the existing internal ERP built in WinForms.

    technologies:
