# CV data source — ENGLISH (public layer).
# Single source of truth for the site (/). The PDF combines this file with
# the private layer in data/private/ (gitignored, never published) — see
# data/schemas/cv.private.schema.json. See data/schemas/cv.schema.json for
# the valid shape of this file.
#
# Employers: each experience entry carries employer.name and employer.sector,
# both public. The only contact detail kept separate, in a private layer
# consumed only by PDF generation, is the phone number.
#
# Voice: all public content speaks in first person (Diego's own voice). No
# highlight or bio is written in the third person, as if by someone else
# (a system can still be described in third person: "consumes",
# "generates", "lets").

meta:
  language: en
  lastUpdated: "2026-09-21"

person:
  name: "Diego Chiquiar"
  headline: "Software Developer"
  location: "Montevideo, Uruguay"
  # CONTRACT with the code (src/lib/content.js, splitParagraphs): this field
  # can hold several paragraphs, separated by a blank line. The YAML folded
  # block (`>-`) is REQUIRED for that — it's not a formatting preference.
  # If changed to a literal block (`|`), every wrapped line renders as its
  # own paragraph instead of one.
  #
  # The original paragraph 1 (support-desk origin story) moved out of here:
  # it's the hero intro (person.intro, below), not published twice (ADR-0015).
  summary: >-
    I'm a .NET/C# developer specialized in integrations, automation, and
    enterprise systems in production.

    I combine development experience with several years in support and
    infrastructure, which shapes how I design software — with an eye on
    operations, failure modes, and maintainability.

    I'm currently expanding my profile toward web development and DevOps.
  # Short hero intro, next to the portrait (ADR-0015). Short variant chosen
  # by Diego over intro-hero.md — Option A. Compresses the paragraph 1 that
  # moved out of person.summary (above): not published twice.
  intro: >-
    I mainly develop software in .NET. Before that, I spent years on the
    other end of the phone when systems went down, so today I design with
    an eye on what happens when something fails. One of the last systems I
    built processes about 1,500 operations a day with six banks and has
    been in production for over a year.
  availability: "Hybrid or remote in Uruguay"
  email: "diegochiquiar@gmail.com"
  links:
    linkedin: null # Pending confirmation.
    github: null # Pending confirmation.

experience:
  - id: job-1
    role: "Software Developer"
    employer:
      name: "Tecnisegur"
      sector: "Cash-in-transit / valuables transport company"
    location: "Montevideo, Uruguay"
    startDate: "2024-04"
    endDate: "2026-09"
    current: false
    summary: "Designed and built internal systems to automate operational, banking and commercial processes."
    projects:
      - name: "TAAS — Automated Settlement System"
        # Two paragraphs, separated by a blank line — same splitParagraphs
        # contract as person.summary.
        description: >-
          Automates the bank settlements triggered by deposits made into
          smart safes. It connects with six banks through different
          channels — from file exchange to web services — and processes
          around 1,500 operations a day with no manual intervention.

          Includes monitoring and reprocessing tools so operators can
          manually resolve a settlement whenever an exception comes up.
        technologies:
          - "C#"
          - ".NET"
          - "ASP.NET Core"
          - "WPF"
          - "MVVM"
          - "Quartz.NET"
          - "SQL Server"
          - "SQLite"
          - "Azure"
      - name: "Valuables Tracking App"
        description: >-
          Android app used by field crews to log and track each shipment
          along its route through seal scanning, geolocation and status
          changes.

          Built to work offline: it stores operations locally during
          periods without coverage and syncs once connectivity is back.
          Published and distributed through Google Play.
        technologies:
          - ".NET for Android"
          - "Xamarin.Forms"
          - "SQLite"
          - "Google ML Kit"
          - "Geolocation"
          - "Google Play Console"
      - name: "Subscriptions and Payments System"
        description: >-
          Built an internal API that connects the sales system with
          Mercado Pago to create and manage subscriptions and payments
          from the quoting platform.

          Handles the full lifecycle of each transaction — approved,
          rejected, expired or reversed payments, as well as renewals and
          cancellations — and integrates Twilio to send notifications for
          those events.
        technologies:
          - "C#"
          - ".NET"
          - "ASP.NET Core"
          - "REST API"
          - "Mercado Pago API"
          - "SQL Server"
          - "Twilio"
    highlights:
      - "Internal ERP — Maintained and built modules for HR, Sales, Billing and Treasury on an existing WinForms application."
    technologies:
      - "C#"
      - ".NET"
      - "ASP.NET Core"
      - "SQL Server"
      - "WPF"
      - ".NET for Android"
      - "WinForms"

