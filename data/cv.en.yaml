person:
  name: "Diego Chiquiar"
  headline: "Software Developer — .NET / C#"
  location: "Montevideo, Uruguay (UTC-3)"
  seniority: "Semi Senior (SSR)"
  # CONTRACT with the code (src/lib/content.js, splitParagraphs): this field
  # can hold several paragraphs, separated by a blank line. The YAML folded
  # block (`>-`) is REQUIRED for that — it's not a formatting preference.
  # If changed to a literal block (`|`), every wrapped line renders as its
  # own paragraph instead of one.
  summary: >-
    Before I wrote software I spent years on the other side of it: picking up the
    phone when a system went down and people were standing around, unable to work.
    That is where the way I build backends comes from. When I design something,
    the first question is not how it behaves when everything goes right, but what
    happens when it does not: what gets lost, who finds out, and how it gets fixed
    without stopping the operation.

    What I am strongest at is .NET backend work over SQL Server, and the problems
    I keep going back to look alike: getting two systems that were never meant to
    talk to each other to agree, and then making that run on its own, every day,
    with nobody watching it. The language matters less to me than the problem,
    which is usually the same one: a process someone is holding together by hand
    that should not depend on that person showing up.

    I am looking to take that into a wider context than the .NET niche. Not to
    leave it behind, but because the judgment about how to build something travels
    between stacks far better than the tooling does, and I want to work with
    people who argue about that. Alongside it I am working my way into the web
    side and into DevOps, and I am clear about which of those I have run in
    production and which I have not. I am looking for my next role and available
    to start immediately, remote or hybrid, working from Montevideo on UTC-3 —
    which overlaps almost entirely with US business hours.

    Outside working hours I build things with no commercial justification at all,
    just because a problem stays with me: what you see above came out of that. It
    is also where I try what I cannot use at work yet, and where I learn fastest.
    If that sounds like the person you need, my email is right below.
  availability: "Hybrid or remote in Uruguay; open to remote work abroad"
  email: "diegochiquiar@gmail.com"
  links:
    linkedin: null # Pending confirmation.
    github: null # Pending confirmation.

experience:
  - id: job-1
    role: "Software Developer"
    employer:
      name: "Tecnisegur"
      sector: "Cash-in-transit / valuables transport company"
    location: "Montevideo, Uruguay"
    startDate: "2024-04"
    endDate: "2026-09"
    current: false
    summary: "Designed and built the two in-house systems the company operates on."
    projects:
      - name: "TAS — Tecnisegur Automatic Accreditation System"
        description: "The system that automatically settles, with each bank, the cash customers deposit into the smart safes in their stores — the country's largest retail chains. It queries the safes through an external provider's web service, pulls the deposits into our own database and builds each bank's settlement: six banks, four different ways of receiving it, from a file dropped in a shared folder to a web service. Around 1,500 settlements a day with no manual step, in production for over a year. I built it as a desktop application rather than an unattended service for an operational reason: when a settlement fails, an operator has to be able to re-run it by hand, there and then."
        technologies:
          - "C#"
          - "ASP.NET Core"
          - "WPF with MVVM"
          - "Quartz.NET"
          - "SQL Server"
          - "SQLite"
          - "Windows Server on Azure"
      - name: "Cash-tracking mobile app"
        description: "The Android app crews use to follow every shipment from dispatch to delivery. Scanning a seal at each step changes the shipment's state and records who did it, when and where. It works with no signal — an armoured truck spends much of the day out of coverage, so the app stores everything locally and reconciles against the server once the connection is back. Published on Google Play."
        technologies:
          - ".NET for Android"
          - "Migrated from Xamarin.Forms"
          - "SQLite"
          - "Geolocation"
    highlights:
      - "Payment integration with MercadoPago — Built the internal API a salesperson calls from the quoting site to create a subscription, and which owns everything that happens afterwards: payments that clear, fail, get reversed or expire, and subscriptions that renew or lapse. (Own REST API on top of MercadoPago's; subscriptions and single-item checkout.)"
      - "Internal ERP — Maintained the company's management ERP and built new forms for HR, Sales, Billing and Treasury. (WinForms.)"
    technologies:
