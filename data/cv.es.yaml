    employer:
      name: "Tecnisegur"
      sector: "Empresa de transporte de valores (cash-in-transit)"
    location: "Montevideo, Uruguay"
    startDate: "2024-04"
    endDate: "2026-09"
    current: false
    summary: "Diseñé y construí los dos sistemas propios con los que opera la empresa."
    projects:
      - name: "TAS — Tecnisegur Automatic Accreditation System"
        description: "Sistema que acredita automáticamente a los bancos el dinero que los clientes depositan en los buzones inteligentes de sus locales — las principales cadenas de retail del país. Consulta los buzones a través del web service de un proveedor externo, baja los depósitos a la base propia y arma la acreditación de cada banco: seis bancos con cuatro formas distintas de recibirla, desde un archivo dejado en una carpeta compartida hasta un web service. Unas 1.500 acreditaciones por día sin intervención manual, más de un año en producción. Lo construí como aplicación de escritorio y no como servicio desatendido por una razón operativa: si una acreditación falla, un operador tiene que poder rehacerla a mano en el momento."
        technologies:
          - "C#"
          - "ASP.NET Core"
          - "WPF con MVVM"
          - "Quartz.NET"
          - "SQL Server"
          - "SQLite"
          - "Servidor Windows en Azure"
      - name: "App de rastreo de valores"
        description: "App Android con la que el personal operativo sigue cada remesa desde que sale hasta que llega a destino. Se escanea el precinto en cada paso y eso cambia el estado, dejando registrado quién lo hizo, cuándo y dónde. Funciona sin señal: un camión de caudales pasa buena parte del día sin cobertura, así que la app guarda todo localmente y reconcilia contra el servidor al recuperar conexión. Publicada en Google Play."
        technologies:
          - ".NET for Android"
          - "Migrada desde Xamarin.Forms"
          - "SQLite"
          - "Geolocalización"
    highlights:
      - "Integración de pagos con MercadoPago — Construí la API interna que usa el vendedor para generar una suscripción desde la web de cotización, y que se hace cargo de todo lo que pasa después: pagos que se acreditan, fallan, se revierten o vencen, y suscripciones que renuevan o se dan de baja. (API REST propia sobre la de MercadoPago; suscripciones y checkout de compra directa.)"
      - "ERP interno — Mantuve el ERP de gestión de la empresa y le desarrollé formularios nuevos para RRHH, Comercial, Facturación y Tesorería. (WinForms.)"
