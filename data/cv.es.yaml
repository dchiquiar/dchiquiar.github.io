person:
  name: "Diego Chiquiar"
  headline: "Desarrollador de Software — .NET / C#"
  location: "Montevideo, Uruguay (UTC-3)"
  seniority: "Semi Senior (SSR)"
  # CONTRATO con el código (src/lib/content.js, splitParagraphs): este campo
  # puede tener varios párrafos, separados por una línea en blanco. El
  # bloque plegado YAML (`>-`) es OBLIGATORIO para eso — no es preferencia
  # de formato. Si se cambia a bloque literal (`|`), cada línea del wrap se
  # renderiza como un párrafo suelto en vez de uno solo.
  summary: >-
    Antes de escribir software estuve años del otro lado: atendiendo cuando un
    sistema se caía y había gente parada esperando para poder trabajar. De ahí
    sale la forma en que escribo backend hoy. Cuando diseño algo, la primera
    pregunta no es cómo funciona si todo sale bien, sino qué pasa cuando falla:
    qué se pierde, quién se entera y cómo se arregla sin frenar la operación.

    Lo que mejor hago es backend en .NET sobre SQL Server, y los problemas que me
    atraen se parecen bastante entre sí: hacer que dos sistemas que nunca fueron
    pensados para hablarse terminen de acuerdo, y que eso después corra solo todos
    los días sin que nadie lo esté mirando. Me importa menos el lenguaje que el
    problema, que casi siempre es el mismo: un proceso que hoy alguien sostiene a
    mano y que no debería depender de que esa persona esté.

    Ahora quiero llevar eso a un contexto más amplio que el nicho .NET. No para
    dejarlo atrás, sino porque el criterio con el que se decide cómo construir
    algo viaja entre stacks mucho mejor que las herramientas, y quiero trabajar en
    equipos donde eso se discuta. En paralelo estoy entrando al lado web y a
    DevOps, y tengo claro qué de eso ya usé en producción y qué todavía no. Estoy
    buscando trabajo y disponible para empezar de inmediato, en híbrido o remoto
    desde Montevideo, y tomo remoto para el exterior.

    Fuera del horario construyo cosas que no tienen ninguna justificación
    comercial, sólo porque el problema me queda dando vueltas: lo que ves acá
    arriba salió de ahí. Es también donde pruebo lo que todavía no puedo usar en
    el trabajo, y donde aprendo más rápido. Si estás buscando a alguien así, mi
    mail está abajo.
  availability: "Híbrido o remoto en Uruguay; remoto para el exterior"
  email: "diegochiquiar@gmail.com"
  links:
    linkedin: null # Pendiente de confirmar.
    github: null # Pendiente de confirmar.

