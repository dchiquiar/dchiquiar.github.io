experience:
  - id: job-1
    role: "Desarrollador de Software"

    employer:
      name: "Tecnisegur"
      sector: "Empresa de transporte de valores (cash-in-transit)"

    location: "Montevideo, Uruguay"
    startDate: "2024-04"
    endDate: "2026-09"
    current: false

    summary: >-
      Diseñé y desarrollé sistemas internos para automatizar procesos
      operativos, bancarios y comerciales.

    projects:
      - name: "TAAS — Sistema automático de acreditaciones"

        description: >-
          Sistema que automatiza las acreditaciones bancarias generadas por
          depósitos realizados en buzones inteligentes. Se integra con seis
          bancos mediante distintos mecanismos, desde intercambio de archivos
          hasta web services, y procesa unas 1.500 operaciones diarias sin
          intervención manual.

          Incluye herramientas de monitoreo y reprocesamiento para que los
          operadores puedan resolver manualmente una acreditación cuando ocurre
          una excepción.

        technologies:
          - "C#"
          - ".NET"
          - "ASP.NET Core"
          - "WPF"
          - "MVVM"
          - "Quartz.NET"
          - "SQL Server"
          - "SQLite"
          - "Azure"

      - name: "App de rastreo de valores"

        description: >-
          Aplicación Android utilizada por el personal operativo para registrar
          y seguir cada remesa durante su recorrido mediante escaneo de
          precintos, geolocalización y cambios de estado.

          Fue diseñada para funcionar offline: persiste las operaciones
          localmente durante los períodos sin cobertura y las sincroniza al
          recuperar conectividad. Publicada y distribuida mediante Google Play.

        technologies:
          - ".NET for Android"
          - "Xamarin.Forms"
          - "SQLite"
          - "Google ML Kit"
          - "Geolocalización"
          - "Google Play Console"

      - name: "Sistema de suscripciones y pagos"

        description: >-
          Desarrollé una API interna que integra el sistema comercial con
          Mercado Pago para crear y administrar suscripciones y pagos desde la
          plataforma de cotización.

          El sistema gestiona el ciclo completo de cada operación: pagos
          aprobados, rechazados, vencidos o revertidos, además de renovaciones
          y cancelaciones. También integra Twilio para enviar notificaciones
          asociadas a esos eventos.

        technologies:
          - "C#"
          - ".NET"
          - "ASP.NET Core"
          - "API REST"
          - "Mercado Pago API"
          - "SQL Server"
          - "Twilio"

    highlights:
      - >-
        ERP interno — Mantuve y desarrollé módulos para RRHH, Comercial,
        Facturación y Tesorería sobre una aplicación WinForms existente.

    technologies:
