experience:
  - id: job-1

    role: "Desarrollador de Software"

    employer:
      name: "Tecnisegur"
      sector: "Transporte de valores y servicios de seguridad"

    location: "Montevideo, Uruguay"

    startDate: "2024-04"
    endDate: "2026-09"
    current: false

    summary: >-
      Encargado de diseñar y desarrollar aplicaciones para brindar soluciones específicas a la empresa y sus clientes.
      Estuve involucrado en varios proyectos, en algunos desde cero hasta producción y en otros integrando funcionalidades nuevas.

    projects:
      - name: "TAAS. Sistema automático de acreditaciones"

        description: >-
          Desarrollé un sistema que automatiza las acreditaciones bancarias
          generadas por depósitos realizados en buzones inteligentes.

          Se integra con seis bancos mediante distintos mecanismos, desde
          intercambio de archivos hasta servicios web, y procesa unas
          1.500 operaciones diarias sin intervención manual.

          También incluye herramientas de monitoreo y reprocesamiento para que
          los operadores puedan resolver excepciones sin alterar el flujo
          normal del sistema.

        technologies:
          - "C#"
          - ".NET"
          - "ASP.NET Core"
          - "WPF"
          - "MVVM"
          - "Quartz.NET"
          - "SQL Server"
          - "SQLite"
          - "Azure"


      - name: "Aplicación Android de rastreo de valores"

        description: >-
          Desarrollé una aplicación Android para el seguimiento operativo de
          remesas mediante escaneo de precintos, geolocalización y cambios de
          estado.

          Fue diseñada con funcionamiento offline: persiste las operaciones
          localmente durante períodos sin cobertura y las sincroniza cuando
          recupera conectividad.

          La aplicación fue publicada y distribuida mediante Google Play.

        technologies:
          - ".NET for Android"
          - "Xamarin.Forms"
          - "SQLite"
          - "Google ML Kit"
          - "Geolocalización"
          - "Google Play Console"


      - name: "Venta de alarmas - Sistema de suscripciones y pagos"

        description: >-
          Desarrollé una API interna que integra la plataforma comercial con
          Mercado Pago para administrar pagos y suscripciones.

          El sistema gestiona el ciclo de vida de cada operación, incluyendo
          aprobaciones, rechazos, vencimientos, reversiones, renovaciones y
          cancelaciones, e integra Twilio para enviar las notificaciones
          asociadas.

        technologies:
          - "C#"
          - ".NET"
          - "ASP.NET Core"
          - "API REST"
          - "Mercado Pago API"
          - "SQL Server"
          - "Twilio"

    highlights:
      - >-
        Mantuve y desarrollé módulos de RRHH, Comercial, Facturación y
        Tesorería sobre el ERP interno existente en WinForms.

