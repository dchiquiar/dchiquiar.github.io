    role: "Desarrollador de Software"
    employer:
      name: "Tecnisegur"
      sector: "Empresa de transporte de valores (cash-in-transit)"
    location: "Montevideo, Uruguay"
    startDate: "2024-04"
    endDate: "2026-09"
    current: false
    summary: null
    highlights:
      - "Diseñé y construí desde cero una aplicación de escritorio en WPF (.NET Core, patrón MVVM) que funciona como consola de operación y aloja jobs de Quartz.NET para la acreditación bancaria automática: consume los web services de los buzones inteligentes, procesa los depósitos y genera los archivos de acreditación enviados a los bancos. Más de 1 año en producción, ~1.500 acreditaciones diarias sin intervención manual, con 6 bancos integrados."
      - "Rediseñé el motor de programación horaria: reemplacé jobs de horario fijo por una arquitectura configurable desde base de datos con Quartz.NET. Usa un mutex para garantizar instancia única y una base SQLite local para persistir el estado de los jobs del día, de forma que un reinicio no pierde qué corrió. Permite cambiar los horarios de los clientes sin nuevos despliegues."
      - "Reconstruí de punta a punta, en .NET for Android, una app de rastreo de valores con geolocalización que originalmente era Xamarin.Forms. Publicada en Google Play Console, con ~20 usuarios operativos."
      - "Desarrollé un sistema de trazabilidad de remesas para clientes, con consulta en línea de estado y ubicación del dinero, que redujo las consultas manuales al área de atención."
      - "Mantuve un ERP interno en WinForms usado por las áreas de RRHH, Comercial, Facturación y Tesorería, distribuido mediante instalador."
      - "Construí APIs REST internas y sus interfaces siguiendo principios SOLID, y capacité a usuarios finales."
