      - src: "/hobbies/setup-04.webp"
        width: 800
        height: 1050
        alt:
          es: "Escritorio con dos monitores: uno con una terminal de código y el otro con el editor de Unity mostrando un mapa de pixel art, más teclado y mouse negros, un teléfono en un soporte y un globo terráqueo"
          en: "Desk with two monitors: one showing a code terminal and the other the Unity editor with a pixel-art map, plus a black keyboard and mouse, a phone on a stand, and a desktop globe"

  - id: "fito"
