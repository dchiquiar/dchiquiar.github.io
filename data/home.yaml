# Copy propia del rediseño de la home (portada, anotación y cifras de los
# casos). Bilingüe por campo, igual que proyectos.yaml y hobbies.yaml.
#
# Todo lo que dice este archivo tiene que estar respaldado por algo que ya
# está en data/cv.*.yaml o que Diego confirmó: no inventar cifras.
# Validar contra data/schemas/home.schema.json.

meta:
  lastUpdated: "2026-11-11"

cover:
  kicker:
    es: "Portfolio · 2026"
    en: "Portfolio · 2026"

  coordinates: "Montevideo · 34.90° S, 56.16° W"

  # Título grande de la portada: `lead` va arriba, `emphasis` abajo con el
  # subrayado a mano y el punto en color de acento.
  title:
    lead:
      es: "Software pensado"
      en: "Software built to"
    emphasis:
      es: "para producción"
      en: "run in production"

  # Entre [corchetes] = palabra resaltada en color de acento.
  lede:
    es: "Hoy desarrollo sistemas en [.NET / C#] como independiente y estudio [DevOps] en ORT."
    en: "Currently building [.NET / C#] systems as an independent developer and studying [DevOps] at ORT."

  # Entre {llaves} = palabra encerrada en un círculo a mano, con la nota al costado.
  statement:
    es: "Antes de escribir software pasé seis años en soporte e infraestructura. Por eso diseño pensando en la {operación}: en cómo falla, cómo se monitorea y quién lo mantiene."
    en: "Before writing software I spent six years in support and infrastructure. So I design with {operations} in mind: how it fails, how it's monitored, and who keeps it running."

  note:
    es: "persistente por naturaleza:\nsi algo se rompe,\nlo sigo hasta el fondo."
    en: "persistent by nature:\nif something breaks,\nI follow it to the root."

# Empleos (ids de experience en cv.*.yaml) cuyo nombre NO se muestra en la
# web: en su lugar se muestra el rubro (employer.sector). Decisión de Diego,
# 2026-11-11. El PDF del CV es aparte y sí lo nombra.
hideEmployerNames:
  - job-1

# Tarjetas de "trabajo de campo": capacidades descritas en forma general, sin
# nombrar al empleador ni a sus sistemas internos (decisión de Diego,
# 2026-11-11). Los bancos sí se nombran: son contrapartes de integración.
cases:
  - value: "5"
    unit:
      es: "bancos integrados"
      en: "banks integrated"
    caption:
      es: "BBVA · Itaú · Santander · Scotiabank · Heritage"
      en: "BBVA · Itaú · Santander · Scotiabank · Heritage"
    figure: banks
    title:
      es: "Integraciones bancarias"
      en: "Bank integrations"
    text:
      es: "Experiencia hands-on integrando sistemas con bancos mediante web services e intercambio de archivos, con procesos automáticos que corren sin intervención manual."
      en: "Hands-on experience integrating systems with banks through web services and file exchange, with automated processes that run without manual intervention."
    technologies: ["C#", ".NET", "ASP.NET Core", "Web services", "SQL Server", "Quartz.NET"]

  - value: "Offline"
    unit:
      es: "primero"
      en: "first"
    caption:
      es: "guarda sin cobertura y sincroniza al volver la señal"
      en: "stores without coverage, syncs when signal returns"
    figure: signal
    title:
      es: "Apps Android de trazabilidad"
      en: "Android traceability apps"
    text:
      es: "Experiencia en apps de trazabilidad en Android con Xamarin.Forms y .NET for Android: escaneo, geolocalización y sincronización, publicadas en Google Play Console."
      en: "Experience building Android traceability apps with Xamarin.Forms and .NET for Android: scanning, geolocation and sync, published through Google Play Console."
    technologies: [".NET for Android", "Xamarin.Forms", "SQLite", "Google Play Console"]

  - value: "6"
    unit:
      es: "estados de pago"
      en: "payment states"
    caption:
      es: "aprobado, rechazado, vencido, revertido, renovado, cancelado"
      en: "approved, rejected, expired, reversed, renewed, cancelled"
    figure: states
    title:
      es: "Pasarelas de pago"
      en: "Payment gateways"
    text:
      es: "Experiencia en integraciones con pasarelas de pago como Mercado Pago: pagos y suscripciones con todo su ciclo de vida y notificaciones asociadas."
      en: "Experience integrating payment gateways such as Mercado Pago: payments and subscriptions across their full lifecycle, with the related notifications."
    technologies: ["C#", ".NET", "REST APIs", "Mercado Pago API", "SQL Server"]
