projects:
  - id: mcp-sql-server
    title:
      es: >-
        Un servidor MCP que deja a un asistente de IA leer una base SQL
        Server — y nada más
      en: >-
        An MCP server that lets an AI read your SQL Server — and nothing
        else
    description:
      es: >-
        Le da a un asistente de IA acceso de sólo lectura a una base SQL
        Server: puede consultarla y recorrer su estructura, y no puede
        modificar nada.
      en: >-
        Gives an AI assistant read-only access to a SQL Server database:
        it can query the data and walk the schema, and it cannot change
        anything.
    problem:
      es: >-
        Lo difícil no es ejecutar la consulta: es garantizar que no haga
        daño cuando el que la escribe es un modelo que puede equivocarse.
        Puse cinco controles en capas —un usuario de base con permisos de
        sólo lectura, validación de la sentencia antes de ejecutarla,
        tiempo máximo de ejecución, límite de filas devueltas y registro
        de todo lo que se consultó— partiendo de que cualquiera de ellos
        puede fallar y de que ninguno confía en el anterior. Es el mismo
        criterio con el que trabajé en producción: diseñar para el
        momento en que algo sale mal, no para el caso feliz.
      en: >-
        Running the query is the easy part. The hard part is making sure
        it can't do damage when the thing writing it is a model that can
        be wrong. There are five layered controls — a database user with
        read-only permissions, statement validation before execution, an
        execution timeout, a row-count cap, and a log of every query that
        ran — built on the assumption that any one of them can fail and
        that none of them trusts the one before it. It's the same
        principle I worked with in production: design for the moment
        something goes wrong, not for the happy path.
    repoUrl: null
    liveUrl: null
    status: planned
    technologies:
      - C#
      - .NET
      - SQL Server
      - MCP (Model Context Protocol)
      - Defensa en capas

  - id: game-server
    title:
      es: Servidor de juego multijugador en .NET
      en: Multiplayer game server in .NET
    description:
      es: >-
        Un servidor propio en .NET con cliente en Unity, donde el
        servidor es la única fuente de verdad: decide quién se movió,
        quién golpeó a quién y qué ve cada jugador.


        Lo que se ve acá es el sistema corriendo. Lo que puedo contar
        en detalle son las decisiones: qué confirma el servidor, qué
        anticipa el cliente para que el juego se sienta inmediato, y
        por qué elegí eso y no otra cosa.
      en: >-
        My own .NET server with a Unity client, where the server is the
        single source of truth: it decides who moved, who hit whom, and
        what each player gets to see.


        What you're seeing here is the system running. What I can walk
        through in detail are the decisions: what the server confirms,
        what the client predicts so the game feels immediate, and why I
        picked that over the alternatives.
    images:
      - src: "/projects/urgentum-multiplayer.webp"
        width: 1280
        height: 720
        alt:
          es: "Tres jugadores con nombres distintos conversando por chat en la entrada del pueblo"
          en: "Three named players talking over chat at the town gate"
      - src: "/projects/urgentum-systems.webp"
        width: 1280
        height: 720
        alt:
          es: "Las ventanas de estadísticas, equipo e inventario del personaje abiertas a la vez"
          en: "The character's stats, equipment and inventory windows open at once"
      - src: "/projects/urgentum-hero.webp"
        width: 1280
        height: 720
        alt:
          es: "El personaje en el pueblo, con las barras de vida, maná y energía y la barra de acciones"
          en: "The player character in town, with health, mana and stamina bars and the action bar"
    problem:
      es: >-
        En un juego en línea no se le puede creer al cliente: si el
        jugador dice «estoy acá y te pegué», el servidor tiene que poder
        verificarlo. Valida cada movimiento y cada golpe, guarda el
        estado de los personajes y le manda a cada jugador sólo lo que
        pasa cerca suyo. Es el problema opuesto al de un sistema de
        gestión.
      en: >-
        In an online game you can't take the client's word for anything:
        if a player says "I'm here and I hit you", the server has to be
        able to verify it. It validates every move and every hit,
        persists character state, and sends each player only what is
        happening near them. It's the opposite of a business system.
    repoUrl: null
    liveUrl: null
    status: in-progress
    technologies:
      - C#
      - .NET
      - Unity
      - Tiempo real
      - TCP
      - SQL Server
