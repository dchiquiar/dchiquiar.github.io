# Proyectos que arma la vitrina del sitio.
#
# La selección y el orden son una decisión deliberada, no un default: no
# agregar proyectos ni reordenar los que hay sin que sea igual de
# deliberado. No todos tienen código público — el campo `repoUrl` de cada
# ficha dice si lo tiene. `images` sólo existe donde hay capturas/GIF/
# diagrama aprobados; no inventar rutas de archivos que no existen.
# Validar contra data/schemas/proyectos.schema.json (máximo 4 items).

meta:
  lastUpdated: "2026-09-21"

projects:
  - id: mcp-sql-server

    title:
      es: "MCP de solo lectura para SQL Server"
      en: "Read-only MCP server for SQL Server"

    description:
      es: >-
        Servidor MCP en .NET que permite a un asistente de IA consultar
        datos y explorar el esquema de SQL Server manteniendo acceso
        estrictamente de solo lectura.
      en: >-
        A .NET MCP server that allows an AI assistant to query data and
        explore a SQL Server schema while maintaining strictly read-only
        access.

    problem:
      es: >-
        El desafío no es ejecutar SQL, sino controlar qué puede hacer un
        modelo cuando genera una consulta incorrecta o insegura. El diseño
        combina permisos de solo lectura a nivel de base de datos, validación
        previa, timeouts, límites de filas y auditoría de consultas como capas
        independientes de protección.
      en: >-
        The challenge is not executing SQL, but controlling what a model can
        do when it generates an incorrect or unsafe query. The design combines
        database-level read-only permissions, statement validation, execution
        timeouts, row limits, and query auditing as independent layers of
        protection.

    repoUrl: null
    liveUrl: null
    status: planned

    technologies:
      - C#
      - .NET
      - SQL Server
      - MCP (Model Context Protocol)


  - id: game-server

    title:
      es: "Servidor multijugador autoritativo en .NET"
      en: "Authoritative multiplayer server in .NET"

    description:
      es: >-
        Backend multijugador autoritativo en .NET con cliente Unity. El
        servidor mantiene el estado del mundo y valida en tiempo real
        movimientos, combate y acciones de los jugadores.
      en: >-
        An authoritative multiplayer server built in .NET with a Unity client.
        The server owns the game state and validates player movement, combat,
        and actions in real time.

    images:
      - src: "/projects/urgentum-multiplayer.webp"
        width: 1280
        height: 720
        alt:
          es: "Tres jugadores con nombres distintos conversando por chat en la entrada del pueblo"
          en: "Three named players talking over chat at the town gate"

      - src: "/projects/urgentum-systems.webp"
        width: 1280
        height: 720
        alt:
          es: "Las ventanas de estadísticas, equipo e inventario del personaje abiertas a la vez"
          en: "The character's stats, equipment and inventory windows open at once"

      - src: "/projects/urgentum-hero.webp"
        width: 1280
        height: 720
        alt:
          es: "El personaje en el pueblo, con las barras de vida, maná y energía y la barra de acciones"
          en: "The player character in town, with health, mana and stamina bars and the action bar"

    problem:
      es: >-
        En un juego online, el cliente no puede ser la fuente de verdad.
        El servidor valida movimientos y ataques, persiste el estado de los
        personajes y envía a cada jugador únicamente la información relevante
        de su entorno.
      en: >-
        In an online game, the client cannot be the source of truth.
        The server validates movement and combat, persists character state,
        and sends each player only the information relevant to their
        surroundings.

    repoUrl: null
    liveUrl: null
    status: in-progress

    technologies:
      - C#
      - .NET
      - Unity
      - TCP
      - SQL Server

  - id: portfolio-site

    title:
      es: "Este sitio: portfolio y CV en Astro"
      en: "This site: portfolio and CV in Astro"

    description:
      es: >-
        Portfolio y CV bilingüe construido con Astro y publicado como HTML
        estático en GitHub Pages. El contenido vive en YAML y el código es
        público: se puede leer exactamente cómo está hecho.
      en: >-
        A bilingual portfolio and CV built with Astro and shipped as static
        HTML on GitHub Pages. The content lives in YAML and the code is
        public — you can read exactly how it's built.

    problem:
      es: >-
        El contenido existe en dos idiomas y tiene que seguir diciendo lo
        mismo en los dos. Cada dato vive una sola vez, en YAML, y se valida
        contra un JSON Schema en cada cambio subido: si no valida, el
        pipeline de CI corta el despliegue antes de publicar.
      en: >-
        The content exists in two languages and has to keep saying the same
        thing in both. Each field lives once, in YAML, checked against a JSON
        Schema on every push: if it fails, CI blocks the deploy before
        anything ships.

    repoUrl: "https://github.com/dchiquiar/dchiquiar.github.io"
    liveUrl: "https://dchiquiar.github.io"
    status: done

    technologies:
      - Astro
      - YAML
      - JSON Schema
      - GitHub Actions
      - GitHub Pages
      - CSS
